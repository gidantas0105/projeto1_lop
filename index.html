<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Projeto 1 - LOP</title>
    <style>
      body { margin: 0; }

      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        z-index: 100;
        color: white;
      }

      #output {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 240px;
        height: 180px;
        z-index: 100;
        pointer-events: none;
        border: 2px solid white;
        border-radius: 8px;
      }

      video { display: none; }
    </style>
  </head>
  <body>
    <h2 id="info">Projeto 1 - LOP</h2>
    <video id="video" playsinline></video>
    <canvas id="output"></canvas>
    <script type="module" src="./scenes/tires.js"></script>
  </body>
</html>
